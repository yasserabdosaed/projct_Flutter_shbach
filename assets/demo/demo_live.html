<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>البث المباشر - شبكة الحارث</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, Arial, sans-serif; }
  body {
    background:#000; color:#fff; min-height:100vh; display:flex; flex-direction:column;
  }
  .player-wrap {
    position:relative; width:100%; aspect-ratio:16/9; background:radial-gradient(circle at center,#1A0A3E,#000 75%);
    display:flex; align-items:center; justify-content:center;
  }
  .player-wrap .live-badge {
    position:absolute; top:12px; right:12px; padding:5px 12px; border-radius:20px;
    background:rgba(255,23,68,0.9); font-size:11px; font-weight:700; display:flex; align-items:center; gap:6px;
  }
  .player-wrap .live-badge .dot { width:7px; height:7px; border-radius:50%; background:#fff; animation:pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .player-wrap .center-icon { font-size:72px; opacity:0.9; }
  .player-wrap .play-btn {
    position:absolute; width:70px; height:70px; border-radius:50%;
    background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.3);
    display:flex; align-items:center; justify-content:center; font-size:30px; cursor:pointer;
  }
  .ch-title { padding:16px 20px; font-size:17px; font-weight:700; }
  .ch-title small { display:block; font-size:11px; color:#8A7A9A; font-weight:400; margin-top:3px; }
  .channels { display:flex; gap:10px; overflow-x:auto; padding:0 20px; padding-bottom:16px; }
  .channel {
    min-width:120px; padding:12px; border-radius:14px; text-align:center; cursor:pointer;
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
  }
  .channel.active { border-color:#FF6B35; background:rgba(255,107,53,0.1); }
  .channel .emoji { font-size:26px; display:block; margin-bottom:6px; }
  .channel .name { font-size:11px; }
  .banner {
    margin:8px 20px 0; padding:10px 14px; border-radius:12px; font-size:11px; line-height:1.8;
    background:rgba(255,215,0,0.08); border:1px solid rgba(255,215,0,0.2); color:#FFD700;
  }
  .footer { text-align:center; font-size:11px; color:#555; margin:16px; }
</style>
</head>
<body>
  <div class="player-wrap">
    <span class="live-badge"><span class="dot"></span> مباشر</span>
    <div class="play-btn">▶</div>
  </div>
  <div class="ch-title" id="chTitle">القناة الرياضية 1<small>بث تجريبي - القناة الفعلية متاحة على شبكة الحارث</small></div>
  <div class="channels" id="channels"></div>
  <div class="banner">وضع تجريبي: هذه معاينة للبث المباشر. الترددات الفعلية متاحة داخل شبكة الحارث.</div>
  <div class="footer">© 2026 شبكة الحارث</div>

<script>
  var channels = [
    ['⚽','القناة الرياضية 1','رياضة'],
    ['🏆','القناة الرياضية 2','رياضة'],
    ['🎬','قناة الأفلام','أفلام'],
    ['🌍','قناة الأخبار','أخبار'],
    ['🎵','القناة الموسيقية','موسيقى'],
    ['👨‍👩‍👧','قناة الأسرة','عائلة'],
    ['📚','قناة الأطفال','أطفال'],
    ['🕌','قناة دينية','دين']
  ];
  function render() {
    document.getElementById('channels').innerHTML = channels.map(function(c, i){
      return '<div class="channel '+(i===0?'active':'')+'" onclick="select('+i+')">'+
        '<span class="emoji">'+c[0]+'</span><span class="name">'+c[1]+'</span></div>';
    }).join('');
  }
  function select(i) {
    document.querySelectorAll('.channel').forEach(function(el){ el.classList.remove('active'); });
    document.querySelectorAll('.channel')[i].classList.add('active');
    document.getElementById('chTitle').innerHTML = channels[i][1] +
      '<small>بث تجريبي - القناة الفعلية متاحة على شبكة الحارث</small>';
  }
  render();
</script>
</body>
</html>
